<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Réservation ATC2</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#0052CC;--primary-dark:#003D99;--primary-50:#EFF6FF;--primary-100:#DBEAFE;
  --green:#16A34A;--green-light:#DCFCE7;
  --orange:#D97706;--orange-light:#FEF3C7;
  --red:#DC2626;
  --neutral-50:#F8FAFC;--neutral-100:#F1F5F9;--neutral-200:#E2E8F0;
  --neutral-300:#CBD5E1;--neutral-400:#94A3B8;--neutral-500:#64748B;
  --neutral-600:#475569;--neutral-700:#334155;--neutral-800:#1E293B;
}
html,body{height:100%;overflow-x:hidden;background:var(--neutral-50)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--neutral-800)}
button{cursor:pointer;border:none;font-family:inherit;outline:none;-webkit-appearance:none}
input,select{font-family:inherit;-webkit-appearance:none}

/* ── LOGIN ── */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#002A6B 0%,#0052CC 70%,#1E74E5 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.login-icon{width:60px;height:60px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.login-title{text-align:center;font-size:20px;font-weight:800;color:var(--neutral-800);margin-bottom:4px}
.login-sub{text-align:center;font-size:13px;color:var(--neutral-400);margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--neutral-500);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--neutral-200);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--neutral-800);outline:none;transition:border-color .15s;background:#fff}
.field input:focus{border-color:var(--primary)}
.btn-login{width:100%;padding:14px;background:var(--primary);color:#fff;border-radius:10px;font-size:15px;font-weight:800;letter-spacing:.3px;transition:background .15s;margin-top:6px}
.btn-login:active{background:var(--primary-dark)}
.err-box{background:#FEE2E2;color:#991B1B;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:10px;display:flex;gap:8px;align-items:flex-start}

/* ── APP SHELL ── */
.app{min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#fff;box-shadow:0 0 0 1px var(--neutral-200)}
.topbar{background:var(--primary);padding:14px 16px 12px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px}
.topbar-icon{font-size:22px}
.topbar-info{flex:1;min-width:0}
.topbar-title{font-size:16px;font-weight:800;color:#fff;line-height:1}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-out{padding:6px 12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}

/* ── PROGRESS BANNER ── */
.prog-banner{background:linear-gradient(90deg,var(--primary-dark),var(--primary));padding:12px 16px;display:flex;align-items:center;gap:12}
.prog-text{flex:1;min-width:0}
.prog-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.8)}
.prog-count{font-size:20px;font-weight:800;color:#fff;line-height:1}
.prog-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.prog-bar{height:100%;background:#fff;border-radius:99px;transition:width .4s}
.prog-pct{font-size:13px;font-weight:800;color:#fff;min-width:36px;text-align:right}

/* ── MAG TABS ── */
.mag-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--neutral-200);background:#fff;position:sticky;top:60px;z-index:40}
.mag-scroll::-webkit-scrollbar{display:none}
.mag-tabs{display:flex;padding:0 12px;gap:4px;min-width:max-content}
.mag-tab{padding:10px 14px;font-size:13px;font-weight:700;color:var(--neutral-400);background:none;border:none;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;position:relative}
.mag-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.mag-tab.done{color:var(--green)}
.mag-tab.done.active{color:var(--green);border-bottom-color:var(--green)}
.mag-done-dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-left:5px;vertical-align:middle}

/* ── ARTICLE CARDS ── */
.cards-list{padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:120px}
.art-card{background:#fff;border:1.5px solid var(--neutral-200);border-radius:14px;overflow:hidden;display:flex;gap:0;transition:border-color .15s}
.art-card.reserved{border-color:#BBF7D0}
.art-card.over{border-color:#FDE68A}
.art-img{width:90px;flex-shrink:0;background:var(--neutral-50);display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
.art-img img{max-width:100%;max-height:74px;object-fit:contain}
.art-img .art-logo{position:absolute;bottom:5px;right:5px;max-width:36px;max-height:18px;object-fit:contain}
.art-body{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.art-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.art-code{font-size:10px;font-weight:800;color:var(--neutral-400);font-family:monospace;letter-spacing:.3px}
.art-rayon{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:#EDE9FE;color:#7C3AED}
.art-famille{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--neutral-100);color:var(--neutral-600)}
.art-name{font-size:13px;font-weight:800;color:var(--neutral-800);line-height:1.3}
.art-cible{font-size:11px;color:var(--neutral-400);font-weight:600;margin-top:1px}
.art-cible strong{color:var(--primary);font-weight:800}
/* counter */
.counter{display:flex;align-items:center;gap:0;background:var(--neutral-100);border-radius:99px;overflow:hidden;width:fit-content;margin-top:4px}
.counter-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--neutral-500);background:none;line-height:1;transition:background .1s,color .1s;flex-shrink:0}
.counter-btn:active{background:var(--neutral-200)}
.counter-btn.plus{color:var(--primary)}
.counter-btn.plus:active{background:var(--primary-100)}
.counter-val{min-width:42px;text-align:center;font-size:17px;font-weight:800;color:var(--neutral-800);line-height:36px}
.counter-val.over{color:var(--orange)}
.counter-val.done{color:var(--green)}
/* saved badge */
.saved-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--green-light);color:var(--green)}
.over-badge{background:var(--orange-light);color:var(--orange)}

/* ── SAVE BAR ── */
.save-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--neutral-200);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:50;display:flex;gap:10px;align-items:center}
.btn-save{flex:1;padding:14px;background:var(--primary);color:#fff;border-radius:12px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn-save:active{background:var(--primary-dark)}
.btn-save:disabled{background:var(--neutral-300)}
.save-info{font-size:12px;color:var(--green);font-weight:700;text-align:center;flex-shrink:0}

/* ── EMPTY ── */
.empty{padding:60px 20px;text-align:center;color:var(--neutral-400)}
.empty-icon{font-size:52px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-sub{font-size:13px}

/* ── LOADER ── */
.loader{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--neutral-50)}
.spinner{width:40px;height:40px;border:4px solid var(--neutral-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#F8FAFC">
    <div style="text-align:center">
      <div style="width:40px;height:40px;border:4px solid #E2E8F0;border-top-color:#0052CC;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div>
      <div style="color:#64748B;font-size:14px;font-weight:600">Chargement…</div>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const _dn = new Date();
const TODAY_ISO = _dn.getFullYear() + '-' + String(_dn.getMonth()+1).padStart(2,'0') + '-' + String(_dn.getDate()).padStart(2,'0');
const TODAY_FR  = _dn.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

function uidKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ══ LOGIN ══ */
function LoginView({ onLogin }) {
  const [login, setLogin] = useState('');
  const [pass, setPass]   = useState('');
  const [err, setErr]     = useState('');
  const [busy, setBusy]   = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!login.trim() || !pass.trim()) { setErr('Identifiant et mot de passe requis.'); return; }
    setBusy(true); setErr('');
    try {
      const snap = await db.ref('ptg/reservUsers').once('value');
      const list = snap.val() ? Object.values(snap.val()) : [];
      const user = list.find(u => u.login === login.trim() && u.password === pass.trim() && u.actif !== false);
      if (!user) { setErr('Identifiant ou mot de passe incorrect.'); setBusy(false); return; }
      const sess = { id: user.id, name: user.name, login: user.login, zone: user.zone };
      localStorage.setItem('ptg_resv_sess', JSON.stringify(sess));
      onLogin(sess);
    } catch { setErr('Erreur de connexion.'); }
    setBusy(false);
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-icon">📦</div>
        <div className="login-title">Réservation ATC2</div>
        <div className="login-sub">Connexion chef d'équipe ops</div>
        <form onSubmit={submit}>
          <div className="field">
            <label>Identifiant</label>
            <input value={login} onChange={e=>setLogin(e.target.value)} placeholder="ex: chef.ainsebaa" autoComplete="username" />
          </div>
          <div className="field">
            <label>Mot de passe</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" autoComplete="current-password" />
          </div>
          {err && <div className="err-box">⚠ {err}</div>}
          <button className="btn-login" type="submit" disabled={busy}>{busy ? 'Connexion…' : 'Se connecter'}</button>
        </form>
      </div>
    </div>
  );
}

/* ══ ARTICLE CARD ══ */
function ArticleCard({ cible, rev, value, onChange }) {
  const num  = value !== '' && value !== undefined ? Number(value) : null;
  const isOver = num !== null && num > cible.ciblePalettes;
  const isDone = num !== null && num > 0;
  const pct  = cible.ciblePalettes > 0 && num !== null ? Math.min(num / cible.ciblePalettes * 100, 100) : 0;

  const dec = () => onChange(Math.max(0, (num || 0) - 1));
  const inc = () => onChange((num || 0) + 1);

  return (
    <div className={'art-card' + (isDone && !isOver ? ' reserved' : '') + (isOver ? ' over' : '')}>
      {/* image */}
      <div className="art-img">
        {cible.photoUrl
          ? <img src={cible.photoUrl} alt={cible.libelle} loading="lazy" style={{maxWidth:'100%',maxHeight:74,objectFit:'contain'}} onError={e=>{e.target.outerHTML='<span style="font-size:32px">📦</span>'}} />
          : <span style={{fontSize:32}}>📦</span>
        }
        {cible.logoUrl && <img className="art-logo" src={cible.logoUrl} alt="" loading="lazy" />}
      </div>
      {/* body */}
      <div className="art-body">
        <div className="art-meta">
          {cible.codeInterne && <span className="art-code">#{cible.codeInterne}</span>}
          {cible.rayon && <span className="art-rayon">{cible.rayon}</span>}
          {cible.famille && <span className="art-famille">{cible.famille}</span>}
        </div>
        <div className="art-name">{cible.libelle || cible.codeInterne}</div>
        <div className="art-cible">Cible : <strong>{cible.ciblePalettes}</strong> palette{cible.ciblePalettes>1?'s':''}</div>
        {/* progress mini */}
        {isDone && (
          <div style={{height:3,background:'var(--neutral-200)',borderRadius:99,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:isOver?'var(--orange)':'var(--green)',borderRadius:99,transition:'width .3s'}}></div>
          </div>
        )}
        {/* counter */}
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <div className="counter">
            <button className="counter-btn" onClick={dec} type="button" aria-label="Moins">−</button>
            <span className={'counter-val' + (isOver?' over':isDone?' done':'')}>{num !== null ? num : '—'}</span>
            <button className="counter-btn plus" onClick={inc} type="button" aria-label="Plus">+</button>
          </div>
          {isDone && !isOver && (
            <span className="saved-badge">✓ {rev ? 'Enregistré' : 'À sauvegarder'}</span>
          )}
          {isOver && <span className="saved-badge over-badge">⚠ Au-delà de la cible</span>}
        </div>
      </div>
    </div>
  );
}

/* ══ MAIN APP ══ */
function App() {
  const [session, setSession] = useState(() => {
    try { return JSON.parse(localStorage.getItem('ptg_resv_sess') || 'null'); } catch { return null; }
  });
  const [cibles, setCibles]     = useState([]);
  const [assortMap, setAssortMap] = useState({});
  const [revs, setRevs]         = useState([]);
  const [selMag, setSelMag]     = useState(null);
  const [inputs, setInputs]     = useState({});
  const [dirty, setDirty]       = useState(false);
  const [saving, setSaving]     = useState(false);
  const [savedTime, setSavedTime] = useState({});
  const [loading, setLoading]   = useState(true);

  /* load */
  useEffect(() => {
    if (!session) { setLoading(false); return; }
    const r1 = db.ref('ptg/reservCibles');
    const h1 = r1.on('value', s => setCibles(s.val() ? Object.values(s.val()).filter(c => c.zone === session.zone) : []));
    const r2 = db.ref('ptg/reservations');
    const h2 = r2.on('value', s => {
      setRevs(s.val() ? Object.values(s.val()).filter(r => r.zone === session.zone && r.date === TODAY_ISO) : []);
      setLoading(false);
    });
    /* load assortiment for photo/logo fallback */
    const r3 = db.ref('ptg/assortiment');
    const h3 = r3.on('value', s => setAssortMap(s.val() || {}));
    return () => { r1.off('value', h1); r2.off('value', h2); r3.off('value', h3); };
  }, [session]);

  const magasins = useMemo(() => [...new Set(cibles.map(c => c.magasin))].sort(), [cibles]);

  useEffect(() => {
    if (magasins.length > 0 && !selMag) setSelMag(magasins[0]);
  }, [magasins]);

  /* sync inputs with saved revs when magasin changes */
  useEffect(() => {
    if (!selMag) return;
    const init = {};
    cibles.filter(c => c.magasin === selMag).forEach(c => {
      const r = revs.find(r => r.codeInterne === c.codeInterne && r.magasin === selMag);
      init[c.codeInterne] = r ? r.palettes : 0;
    });
    setInputs(init);
    setDirty(false);
  }, [selMag, cibles, revs]);

  const handleChange = (code, val) => {
    setInputs(p => ({ ...p, [code]: val }));
    setDirty(true);
  };

  const isMagDone = (mag) => {
    const arts = cibles.filter(c => c.magasin === mag);
    return arts.length > 0 && arts.every(c => {
      const r = revs.find(r => r.codeInterne === c.codeInterne && r.magasin === mag);
      return r && r.palettes > 0;
    });
  };

  const handleSave = async () => {
    if (!session || !selMag) return;
    setSaving(true);
    const now = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    const batch = {};
    cibles.filter(c => c.magasin === selMag).forEach(c => {
      const val = inputs[c.codeInterne];
      if (val === undefined || val === '') return;
      const existing = revs.find(r => r.codeInterne === c.codeInterne && r.magasin === selMag);
      const key = existing ? existing.id : uidKey();
      batch[key] = {
        id: key,
        userId: session.id, userName: session.name,
        zone: session.zone, magasin: selMag,
        codeInterne: c.codeInterne,
        libelle: c.libelle || '',
        palettes: Number(val),
        cible: c.ciblePalettes,
        date: TODAY_ISO,
        updatedAt: now,
        createdAt: existing ? (existing.createdAt || now) : now,
      };
    });
    await db.ref('ptg/reservations').update(batch);
    setSavedTime(p => ({ ...p, [selMag]: now }));
    setDirty(false);
    setSaving(false);
  };

  const logout = () => { localStorage.removeItem('ptg_resv_sess'); setSession(null); };

  if (!session) return <LoginView onLogin={setSession} />;

  if (loading) return (
    <div className="loader">
      <div style={{textAlign:'center'}}>
        <div className="spinner"></div>
        <div style={{color:'var(--neutral-500)',fontSize:14,fontWeight:600,marginTop:12}}>Chargement…</div>
      </div>
    </div>
  );

  const curCibles  = selMag ? cibles.filter(c => c.magasin === selMag) : [];
  const totalArts  = cibles.length;
  const doneArts   = revs.filter(r => r.palettes > 0).length;
  const pct        = totalArts > 0 ? Math.round(doneArts / totalArts * 100) : 0;

  return (
    <div className="app">
      {/* topbar */}
      <div className="topbar">
        <span className="topbar-icon">📦</span>
        <div className="topbar-info">
          <div className="topbar-title">{session.zone}</div>
          <div className="topbar-sub">{session.name} · {TODAY_FR}</div>
        </div>
        <button className="btn-out" onClick={logout}>Quitter</button>
      </div>

      {/* progress banner */}
      <div className="prog-banner">
        <div className="prog-text">
          <div className="prog-label">Réservations aujourd'hui</div>
          <div className="prog-count">{doneArts} / {totalArts}</div>
        </div>
        <div className="prog-bar-wrap">
          <div className="prog-bar" style={{width:pct+'%'}}></div>
        </div>
        <div className="prog-pct">{pct}%</div>
      </div>

      {/* magasin tabs */}
      {magasins.length > 0 && (
        <div className="mag-scroll">
          <div className="mag-tabs">
            {magasins.map(mag => (
              <button
                key={mag}
                className={'mag-tab' + (selMag===mag?' active':'') + (isMagDone(mag)?' done':'')}
                onClick={() => setSelMag(mag)}
              >
                {mag}
                {isMagDone(mag) && <span className="mag-done-dot"></span>}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* cards */}
      {magasins.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📭</div>
          <div className="empty-title">Aucun article configuré</div>
          <div className="empty-sub">Contactez le manager pour importer la liste des cibles</div>
        </div>
      ) : (
        <div className="cards-list">
          {savedTime[selMag] && (
            <div style={{background:'#DCFCE7',border:'1px solid #BBF7D0',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:8,fontSize:13,fontWeight:700,color:'#15803D'}}>
              ✓ Enregistré à {savedTime[selMag]}
            </div>
          )}
          {curCibles.map(c => {
            const prod = assortMap[c.codeInterne] || {};
            const enriched = {
              ...c,
              photoUrl: c.photoUrl || prod.photoUrl || '',
              logoUrl:  c.logoUrl  || prod.logoUrl  || '',
              libelle:  c.libelle  || prod.libelle  || c.codeInterne,
              rayon:    c.rayon    || prod.rayon    || '',
              famille:  c.famille  || prod.famille  || '',
            };
            return (
              <ArticleCard
                key={c.codeInterne}
                cible={enriched}
                rev={revs.find(r => r.codeInterne === c.codeInterne && r.magasin === selMag)}
                value={inputs[c.codeInterne] ?? 0}
                onChange={val => handleChange(c.codeInterne, val)}
              />
            );
          })}
        </div>
      )}

      {/* save bar */}
      {magasins.length > 0 && (
        <div className="save-bar">
          <button className="btn-save" onClick={handleSave} disabled={saving || !dirty}>
            {saving ? '⏳ Enregistrement…' : '💾 Enregistrer ' + (selMag || '')}
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
